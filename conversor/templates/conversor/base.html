<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}PDF Conversor{% endblock %}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --border:   #2a2d3a;
      --accent:   #6c63ff;
      --accent2:  #a78bfa;
      --text:     #e2e4f0;
      --muted:    #6b7280;
      --success:  #34d399;
      --danger:   #f87171;
      --radius:   10px;
      --mono:     'JetBrains Mono', monospace;
      --sans:     'Inter', sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── nav ── */
    nav {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .nav-brand {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent2);
      text-decoration: none;
      letter-spacing: -.02em;
    }
    .nav-brand span { color: var(--accent); }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: .875rem;
      font-weight: 500;
      transition: color .15s;
    }
    nav a:hover { color: var(--text); }

    /* ── layout ── */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -.03em;
      margin-bottom: .4rem;
    }
    h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--accent2);
    }
    .subtitle {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 2rem;
    }

    /* ── card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
    }

    /* ── botões ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .55rem 1.2rem;
      border-radius: 7px;
      font-family: var(--sans);
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover { opacity: .88; transform: translateY(-1px); }
    .btn-primary  { background: var(--accent);  color: #fff; }
    .btn-ghost    { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-danger   { background: var(--danger);  color: #fff; }
    .btn-success  { background: var(--success); color: #0f1117; }

    /* ── alerta ── */
    .alert {
      padding: .8rem 1.1rem;
      border-radius: 7px;
      font-size: .875rem;
      margin-bottom: 1.25rem;
    }
    .alert-error { background: #2d1515; border: 1px solid #7f1d1d; color: var(--danger); }

    /* ── tabela ── */
    table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    th {
      text-align: left;
      padding: .6rem .9rem;
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: .75rem .9rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1f2233; }

    /* ── upload zone ── */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 3rem 2rem;
      text-align: center;
      transition: border-color .2s, background .2s;
      cursor: pointer;
    }
    .upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: #1a1d3a; }
    .upload-zone input[type=file] { display: none; }
    .upload-icon { font-size: 2.5rem; margin-bottom: .75rem; }
    .upload-label { font-size: .9rem; color: var(--muted); }
    .upload-label strong { color: var(--accent2); cursor: pointer; }
    .file-chosen { margin-top: 1rem; font-family: var(--mono); font-size: .8rem; color: var(--success); }

    /* ── conteudo pre ── */
    .content-box {
      background: #0b0d14;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      font-family: var(--mono);
      font-size: .8rem;
      line-height: 1.7;
      color: #c8d3f5;
      max-height: 420px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── badge ── */
    .badge {
      display: inline-block;
      padding: .2rem .55rem;
      border-radius: 99px;
      font-size: .7rem;
      font-weight: 600;
    }
    .badge-purple { background: #2d1f6e; color: var(--accent2); }

    .actions { display: flex; gap: .6rem; flex-wrap: wrap; }
    .meta { color: var(--muted); font-size: .8rem; font-family: var(--mono); }
    .empty { text-align: center; padding: 3rem; color: var(--muted); }
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="{% url 'upload' %}">PDF<span>→</span>TXT</a>
    <a href="{% url 'upload' %}">Converter</a>
    <a href="{% url 'lista' %}">Documentos</a>
  </nav>
  <main>
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
